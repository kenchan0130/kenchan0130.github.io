plugins:
  "@textlint/markdown":
    extensions:
      - ".mdx"
rules:
  preset-ja-technical-writing:
    sentence-length:
      max: 140
    max-comma:
      max: 5
    no-exclamation-question-mark: false
    max-kanji-continuous-len:
      # 正式名称や一般的な技術用語
      allow:
        - 世界開発者会議
        - 公開鍵暗号方式
        - 共通鍵暗号方式
        - 金融商品取引業者
        - 第一種金融取引業者
        - 第二種金融取引業者
        - 認定販売代理店
    ja-no-weak-phrase: false
    no-mix-dearu-desumasu:
      preferInList: "ですます"
  preset-ja-spacing: true
  prh:
    rulePaths:
      - ".textlint-prh/kenchan0130.yml"
  no-nfd: true
  "@textlint-ja/preset-ai-writing":
    ai-tech-writing-guideline: false
filters:
  comments: true
  allowlist:
    allow:
      # UIのメニュー階層は「[設定] > [一般]」のように区切り記号の前後にスペースを入れる
      - "/\\] > \\[/"
      # 製品画面の表記に合わせるUI名
      - Win32アプリ
      - アプリの登録
      - アプリ登録
      - アプリのフェデレーションメタデータ
      - ユーザマッピング
      - 「ユーザ名」
      - 認証のバイパスをユーザに許可します
      - オプションのユーザによる変更
      - ユーザに休止状態からの復帰後
