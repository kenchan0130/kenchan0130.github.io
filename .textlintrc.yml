plugins:
  "@textlint/markdown":
    extensions:
      - ".mdx"
rules:
  preset-ja-technical-writing:
    sentence-length:
      max: 140
    max-comma:
      max: 5
    no-exclamation-question-mark: false
    ja-no-weak-phrase: false
    no-mix-dearu-desumasu:
      preferInList: "ですます"
  preset-ja-spacing: true
  prh:
    rulePaths:
      - ".textlint-prh/kenchan0130.yml"
  no-nfd: true
  "@textlint-ja/preset-ai-writing":
    ai-tech-writing-guideline: false
filters:
  comments: true
  allowlist:
    allow:
      # UIのメニュー階層は「[設定] > [一般]」のように区切り記号の前後にスペースを入れる
      - "/\\] > \\[/"
      # 製品画面の表記に合わせるUI名
      - Win32アプリ
      - アプリの登録
      - アプリ登録
      - アプリのフェデレーションメタデータ
      - ユーザマッピング
      - 「ユーザ名」
      - 認証のバイパスをユーザに許可します
      - オプションのユーザによる変更
      - ユーザに休止状態からの復帰後
